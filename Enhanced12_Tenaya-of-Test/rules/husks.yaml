# husks.yaml - generated from misc.yaml

^Husk:
	Health:
		HP: 14000

^VehicleHusk:
	Inherits: ^Husk
	Husk:
		AllowedTerrain: Sand, Rock, Transition, Concrete, Spice, SpiceSand, SpiceBlobs, Dune
	-HiddenUnderFog:
	CaptureManager:
	Capturable:
		Types: husk
	TransformOnCapture:
		ForceHealthPercentage: 15
	AlwaysVisible:
	Crushable@husk:
		CrushClasses: husk
		CrushedByFriendlies: true
		CrushSound: EXPLSML1.WAV
	ChangesHealth:
		Step: -30
		StartIfBelow: 101
		Delay: 4
	GrantRandomCondition:
	WithIdleOverlay@Burns:
		Image: fire_slow
		Sequence: 1_loop
		StartSequence: 1_start
		IsDecoration: True
		RequiresCondition: decoration1 || decoration3
	FloatingSpriteEmitter@SMOKE:
		Image: smoke3
		Lifetime: 10, 20
		Speed: 7
		Gravity: 50
		SpawnFrequency: 2, 10
		RandomFacing: true
		RandomRate: 4
		Offset: 0, 0, 200
		TurnRate: 3
		Duration: 500
		RequiresCondition: decoration2 || decoration3
	FireWarheadsOnDeath:
		Weapon: huskExplode01
		EmptyWeapon: huskExplode01
		Chance: 70

