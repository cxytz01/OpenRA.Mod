saboteur:
	Inherits@selection: ^SelectableSupportUnit
	-Cloak:
	-GrantChargedConditionOnToggle:
	-GrantConditionOnDamageState@UNCLOAK:
	Buildable:
		BuildPaletteOrder: 70
		Prerequisites: ~disabled
		Description: saboteur.description
	ScriptTags:
	Health:
		HP: 9700
	Mobile:
		Speed: 52
		PauseOnCondition: suicide-att || notmobile
	Voiced:
		VoiceSet: SaboteurVoice
	WithDecoration@ScullIcon:
		Image: skullicon
		Sequence: idle
		ValidRelationships: Enemy, Neutral, Ally
		Palette: effect
		Position: BottomRight
		Margin: 5, 6
	Demolition:
		DetonationDelay: 50
		Flashes: 3
		EnterBehaviour: Dispose
	FireWarheadsOnDeath@Selfkill:
		Weapon: PlasmaSaboteur
		EmptyWeapon: PlasmaSaboteur
		RequiresCondition: suicide-att
	FireWarheadsOnDeath@Killed:
		Weapon: HuskC4
		EmptyWeapon: HuskC4
		RequiresCondition: !suicide-att
	GrantConditionOnDeploy:
		DeployedCondition: suicide-att
		PauseOnCondition: suicide-att
	KillsSelf@SuicideKillCount:
		Delay: 45
		RequiresCondition: suicide-att
	TakeCover:
		RequiresCondition: suicide-att
	WithIdleOverlay:
		Sequence: active
		RequiresCondition: suicide-att
	WithIdleOverlay@prone:
		StartSequence: standup
		Sequence: prone-stand
		RequiresCondition: suicide-att
	WithInfantryBody:
		RequiresCondition: !suicide-att
	AmbientSound@onSuicide:
		SoundFiles: audio/explodeSaboteurEmperor02.wav
		RequiresCondition: suicide-att
	SpawnActorOnDeath@craters:
		Actor: crater_small
		RequiresCondition: !suicide-att
	SpawnActorOnDeath@craterb:
		Actor: crater_big
		RequiresCondition: suicide-att
	GrantCondition@temporary-cloak:
		Condition: temporary-clock
