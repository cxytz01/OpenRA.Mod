# tank.yaml - heavy factory units

mcv:
	Buildable:
		Prerequisites: repair_pad
		Queue: Armor
		BuildPaletteOrder: 130
		BuildDuration: 750
		Description: mcv.description
	Valued:
		Cost: 2000
	Health:
		HP: 53000
	Armor:
		Type: light
	Mobile:
		Speed: 31
	RevealsShroud:
		Range: 2c768
	SpawnActorOnDeath:
		RequiresCondition: !worm-attack
	AttractsWorms:
		Intensity: 1170

harvester:
	Buildable:
		Queue: Armor
		Prerequisites: refinery
		BuildDuration: 600
		BuildPaletteOrder: 10
		Description: harvester.description
	Valued:
		Cost: 1200
	Health:
		HP: 45000
	Mobile:
		Speed: 40
	WithDockingAnimation:
	DockClientManager:
	StoresResources:
		Resources: Spice
	Harvester:
		HarvestFacings: 8
		Resources: Spice
		EmptyCondition: harvester-empty
	RevealsShroud:
		Range: 3c768
	FireWarheadsOnDeath:
		Weapon: UnitExplodeLarge
		EmptyWeapon: UnitExplodeLarge
	FireProjectilesOnDeath@ShrapnelNotEmpty:
		Weapons: Debris, Debris2, Debris3, Debris4
		Pieces: 3, 5
		Range: 1c0, 6c0
		RequiresCondition: !harvester-empty
	FireProjectilesOnDeath@DeathHandClusterDebris:
		Weapons: DeathHandClusterDebris
		Pieces: 1, 3
		Range: 1c0, 5c0
		RequiresCondition: !harvester-empty
	FireProjectilesOnDeath@ShrapnelEmpty:
		Weapons: Debris, Debris2
		Pieces: 0, 2
		Range: 1c0, 6c0
		RequiresCondition: harvester-empty
	FireProjectilesOnDeath@throwSpice:
		Weapons: HarvesterSpiceExplosion
		Pieces: 1, 4
		Range: 1c0, 5c0
		RequiresCondition: !harvester-empty
	FireProjectilesOnDeath@wheel:
		Weapons: debris_harvester_wheel01, debris_harvester_wheel02
		Pieces: 0, 2
		Range: 3c0, 5c0
	SpawnActorOnDeath:
		RequiresCondition: !worm-attack && harvester-empty
	AttractsWorms:
		Intensity: 744

