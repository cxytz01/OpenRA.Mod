devastator:
	Buildable:
		Prerequisites: upgrade.heavy, research_centre, ~heavy.harkonnen
		BuildDuration: 690
		BuildPaletteOrder: 90
		Description: devastator-desc.description
	Valued:
		Cost: 1200
	Health:
		HP: 60000
	Armor:
		Type: heavy
	Mobile:
		TurnSpeed: 12
		Speed: 30
	Armament:
		Weapon: DevBullet
		LocalOffset: 640,0,32
		MuzzleSequence: muzzle
	GrantConditionOnDamageState@forbot:
		Condition: low-hp
		ValidDamageStates: Critical
	GrantCondition@botselfdestruct:
		Condition: overload
		RequiresCondition: low-hp && bot-owned && !unit-capturated
	GrantConditionOnDeploy@REACTOR:
		DeployedCondition: overload
		PauseOnCondition: overload
	KillsSelf@MELTDOWN:
		Delay: 150
		GrantsCondition: meltdown
		RequiresCondition: overload
	ChangesHealth:
		Step: 45
		Delay: 3
		StartIfBelow: 50
	AmbientSound@onMeltDown:
		SoundFiles: audio/DevastatorMeltdown01.wav
		RequiresCondition: overload
	FireWarheadsOnDeath@OVERLOAD:
		Weapon: PlasmaDevastator
		EmptyWeapon: PlasmaDevastator
		RequiresCondition: meltdown
	FireProjectilesOnDeath@TrowOnMeldown:
		Weapons: Debris2, DeathHandClusterDebris, Debris4, DerbisSiegetank
		Pieces: 4, 7
		Range: 2c205, 3c614
		RequiresCondition: meltdown
	FireProjectilesOnDeath@standart:
		Weapons: Debris, Debris3, DerbisSiegetank
		Pieces: 1, 2
		RequiresCondition: !meltdown
	SpawnActorOnDeath:
		RequiresCondition: !meltdown && !worm-attack
	SpawnActorOnDeath@crater:
		Actor: crater_med
		RequiresCondition: meltdown
		Offset: -1,0
	AttractsWorms:
		Intensity: 840

