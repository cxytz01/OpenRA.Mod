# aircraft.yaml - generated from units.yaml

carryall.reinforce:
	Inherits: ^Plane
	Inherits@SandStorm: ^SandStorm
	Valued:
		Cost: 1000
	Health:
		HP: 20000
	Armor:
		Type: light
	Aircraft:
		CruiseAltitude: 2160
		CruisingCondition: cruising
		Speed: 144
		TurnSpeed: 16
		LandableTerrainTypes: Sand, Rock, Transition, Spice, SpiceSand, Dune, Concrete
		Repulsable: False
		AirborneCondition: airborne
		CanSlide: True
		VTOL: true
		IdleTurnSpeed: 4
		IdleSpeed: 115
		MinAirborneAltitude: 400
		TakeoffSounds: audio/adv_carryall_takeoff_1.wav
		LandingSounds: audio/adv_carryall_land_1.wav
	GrantConditionOnDamageState@HEAVY:
		Condition: heavy-damage
	Cloak:
	HiddenUnderFog:
		AlwaysVisibleRelationships: Ally
	FloatingSpriteEmitter@smoke:
		RequiresCondition: heavy-damage
		Image: smoke3
		Lifetime: 20, 22
		Speed: 15
		Gravity: 10
		SpawnFrequency: 2, 7
		RandomFacing: true
		RandomRate: 4
		Offset: 300,383,0
		TurnRate: 3
		Duration: 500
	FireProjectilesOnDeath@derbis:
		Weapons: Debris, Debris2, debris_vehicle01, debris_vehicle02
		Pieces: 1, 3
		Range: 1c0, 6c0
	FireProjectilesOnDeath@derbisExplosions:
		Weapons: DeathHandClusterDebris
		Pieces: 1 , 3
		Range: 1c0, 5c0
	FireProjectilesOnDeath@derbisExplosions2:
		Weapons: DeathHandClusterDebris
		Pieces: 0 , 2
		Range: 1c0, 5c0

carryall:
	Inherits@SelectableEco: ^SelectableSupportUnit
	-Interactable:
	-Cloak:
	Buildable:
		BuildPaletteOrder: 101
		Description: carryall-manual.description
	Selectable:
		Priority: 5
	GrantConditionOnBotOwner@BOTOWNER:
		Condition: bot-owned
		Bots: omnius, vidious, gladius
	GrantConditionOnDeploy@AUTO:
		DeployedCondition: manual
		CanDeployOnRamps: true
		SkipMakeAnimation: true
	RejectsOrders@botNoControl:
		RequiresCondition: bot-owned
	AutoCarryall:
		AutoCarryCondition: !manual
		CarryCondition: loaded
		LocalOffset: 0, 0, -128
	Repairable:
		RepairActors: repair_pad
	AmbientSound:
		SoundFiles: audio/carryallSound(2).wav
		RequiresCondition: cruising
	BlocksProjectiles:
		RequiresCondition: airborne
	RevealOnDeath:
	RevealsShroud:
		Range: 0c512
		Type: CenterPosition
		RequiresCondition: loaded
	TemporaryOwnerManager:

carryall.support:
	Inherits: carryall.reinforce
	-Cloak:
	-Carryall:
	-Buildable:
	AutoCarryall:
		LocalOffset: 0, 0, -128

carryall.transport:
	Inherits: carryall
	-Buildable:
	Cargo:
		MaxWeight: 10
		Types: Infantry, Vehicle

